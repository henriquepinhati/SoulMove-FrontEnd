<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="economiaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1DB954;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1aa142;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="#F4F7F9" stroke="url(#economiaGrad)" stroke-width="2"/>
  
  <!-- Wallet/Card -->
  <rect x="50" y="60" width="100" height="80" rx="8" fill="url(#economiaGrad)" opacity="0.9"/>
  <rect x="55" y="65" width="90" height="35" rx="4" fill="#FFFFFF" opacity="0.3"/>
  
  <!-- Points text -->
  <text x="100" y="120" font-size="24" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
    PTS
  </text>
  
  <!-- Coins accent -->
  <g transform="translate(140, 50)">
    <circle cx="0" cy="0" r="12" fill="#ffc107" stroke="url(#economiaGrad)" stroke-width="2"/>
    <text x="0" y="5" font-size="16" text-anchor="middle" fill="#FFFFFF" font-weight="bold">$</text>
  </g>
  
  <!-- Arrow up (growth) -->
  <g transform="translate(60, 50)">
    <line x1="0" y1="15" x2="0" y2="0" stroke="url(#economiaGrad)" stroke-width="2"/>
    <polyline points="0,0 -6,8 6,8" fill="none" stroke="url(#economiaGrad)" stroke-width="2"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="120" r="4" fill="url(#economiaGrad)" opacity="0.5"/>
  <circle cx="170" cy="150" r="3" fill="url(#economiaGrad)" opacity="0.4"/>
</svg>
